<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tester Universal: Widevine Clean to ClearKey</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.compiled.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        h2 { border-bottom: 2px solid #bb86fc; padding-bottom: 10px; color: #bb86fc; }
        
        .control-group { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        input { width: 100%; padding: 10px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: #bb86fc; outline: none; }
        
        button { width: 100%; padding: 12px; background: #03dac6; color: #000; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #018786; }
        
        #video-container { width: 100%; margin-top: 20px; background: #000; }
        video { width: 100%; display: block; }
        
        .logs { background: #000; height: 150px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 0.8rem; border: 1px solid #333; margin-top: 10px; color: #00ff00; }
        .log-warn { color: #ffeb3b; }
        .log-err { color: #ff5252; }
    </style>
</head>
<body>

<div class="container">
    <h2>DASH Patcher (Widevine -> ClearKey)</h2>

    <div class="control-group">
        <label>URL del Manifiesto (.mpd)</label>
        <input type="text" id="manifestUrl" placeholder="https://..." value="">
    </div>

    <div class="control-group">
        <label>Key ID (Hexadecimal)</label>
        <input type="text" id="keyId" placeholder="Ej: edef8ba979d64acea3c827dcd51d21ed">
        <label style="margin-top:10px">Key (Hexadecimal)</label>
        <input type="text" id="key" placeholder="Ej: 1234567890abcdef1234567890abcdef">
    </div>

    <button onclick="loadVideo()">CARGAR REPRODUCTOR</button>

    <div id="video-container">
        <video id="video" controls autoplay poster="//shaka-player-demo.appspot.com/assets/poster.jpg"></video>
    </div>

    <div class="logs" id="logs">Esperando instrucciones...</div>
</div>

<script>
    let player;

    function log(msg, type='') {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        if(type === 'error') div.className = 'log-err';
        if(type === 'warn') div.className = 'log-warn';
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
        console.log(msg);
    }

    async function init() {
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            const video = document.getElementById('video');
            player = new shaka.Player(video);
            player.addEventListener('error', onError);

            // --- INTERCEPTOR DE RED (EL PARCHE) ---
            player.getNetworkingEngine().registerResponseFilter((type, response) => {
                // Solo modificamos el archivo Manifiesto (.mpd)
                if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST) {
                    patchMpdContent(response);
                }
            });

            log("Sistema listo. Interceptor activado.");
        } else {
            log("Navegador no soportado", "error");
        }
    }

    function patchMpdContent(response) {
        try {
            const decoder = new TextDecoder("utf-8");
            let xml = decoder.decode(response.data);

            const wvUUID = "edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"; // Widevine
            const prUUID = "9a04f079-9840-4286-ab92-e65be0885f95"; // PlayReady
            const ckUUID = "e2719d58-a985-b3c9-781a-b030af78d30e"; // ClearKey

            let modificado = false;

            // 1. ELIMINAR DATOS BASURA (PSSH y PRO)
            // Esto es crucial. Si cambiamos el UUID pero dejamos el PSSH, falla.
            // Buscamos etiquetas <cenc:pssh>...</cenc:pssh> y las vaciamos o borramos.
            const psshRegex = /<cenc:pssh>[\s\S]*?<\/cenc:pssh>/gi;
            const msprRegex = /<mspr:pro>[\s\S]*?<\/mspr:pro>/gi;

            if (psshRegex.test(xml)) {
                log("Limpiando cabeceras PSSH (Widevine)...", "warn");
                xml = xml.replace(psshRegex, ''); 
                modificado = true;
            }
            if (msprRegex.test(xml)) {
                log("Limpiando cabeceras MSPR (PlayReady)...", "warn");
                xml = xml.replace(msprRegex, ''); 
                modificado = true;
            }

            // 2. REEMPLAZAR UUIDs
            if (xml.includes(wvUUID)) {
                log("Reemplazando UUID Widevine -> ClearKey", "warn");
                xml = xml.split(wvUUID).join(ckUUID);
                modificado = true;
            }
            if (xml.includes(prUUID)) {
                xml = xml.split(prUUID).join(ckUUID);
                modificado = true;
            }

            // 3. CAMBIAR NOMBRES DE ESQUEMA (Cosmético pero ayuda)
            xml = xml.replace(/value="Widevine"/gi, 'value="ClearKey"');
            xml = xml.replace(/value="MSPR 2.0"/gi, 'value="ClearKey"');

            if (modificado) {
                const encoder = new TextEncoder("utf-8");
                response.data = encoder.encode(xml);
                log("MPD Parcheado con éxito en memoria.");
            }

        } catch (e) {
            log("Error crítico al parchear MPD: " + e.message, "error");
        }
    }

    async function loadVideo() {
        const url = document.getElementById('manifestUrl').value.trim();
        let kid = document.getElementById('keyId').value.trim().toLowerCase();
        const key = document.getElementById('key').value.trim().toLowerCase();

        // Limpiar guiones del KID si el usuario los puso
        kid = kid.replace(/-/g, '');

        if (!url) { alert("Falta URL"); return; }

        const config = { drm: { clearKeys: {} } };

        if (kid && key) {
            config.drm.clearKeys[kid] = key;
            log(`Configurando Key: ${kid}:${key}`);
        } else {
            log("Advertencia: Cargando sin Keys (fallará si está encriptado)", "warn");
        }

        player.configure(config);

        try {
            log("Descargando manifiesto...");
            await player.load(url);
            log("Video inicializado. ¡Disfruta!");
        } catch (e) {
            onError(e);
        }
    }

    function onError(event) {
        let e = event.detail || event;
        log(`Error ${e.code}: ${e.message}`, "error");
        
        if (e.code === 1002) log(">> ERROR CORS: Activa la extensión 'Allow CORS' en tu navegador.", "warn");
        if (e.code === 6007 || e.code === 6008) log(">> ERROR KEY: La clave o el KeyID son incorrectos.", "warn");
        if (e.code === 4000) log(">> ERROR DECODING: Clave incorrecta o navegador incompatible.", "warn");
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
