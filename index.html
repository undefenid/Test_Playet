<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tester Universal DASH cbcs/cenc</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.compiled.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        #video-container { width: 100%; max-width: 800px; margin: 0 auto; margin-top: 20px; }
        video { width: 100%; border: 1px solid #444; }
        .label { font-size: 0.8em; color: #ccc; margin-bottom: 5px; display: block; }
        .log { font-family: monospace; font-size: 0.8em; background: #000; padding: 10px; margin-top: 10px; height: 150px; overflow-y: scroll; border: 1px solid #444;}
    </style>
</head>
<body>

    <h2>Tester DASH ClearKey (cbcs/cenc)</h2>

    <label class="label">URL del Manifiesto (.mpd)</label>
    <input type="text" id="manifestUrl" placeholder="https://ejemplo.com/video.mpd">

    <label class="label">Key ID (Hexadecimal - Sin guiones)</label>
    <input type="text" id="keyId" placeholder="Ej: abb8c4463c06318290747e6f6c425299">

    <label class="label">Key (Hexadecimal)</label>
    <input type="text" id="key" placeholder="Ej: 1234567890abcdef1234567890abcdef">

    <button onclick="loadVideo()">CARGAR Y REPRODUCIR</button>

    <div id="video-container">
        <video id="video" controls autoplay></video>
    </div>

    <div class="log" id="logBox">Logs del sistema...</div>

    <script>
        let player;

        function log(msg) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        async function init() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                const video = document.getElementById('video');
                player = new shaka.Player(video);
                player.addEventListener('error', onError);
                log("Shaka Player listo.");
            } else {
                log("El navegador no soporta Shaka Player.");
            }
        }

        async function loadVideo() {
            const manifestUrl = document.getElementById('manifestUrl').value.trim();
            const kId = document.getElementById('keyId').value.trim().toLowerCase();
            const k = document.getElementById('key').value.trim().toLowerCase();

            if (!manifestUrl) { alert("Falta la URL del MPD"); return; }

            // Configurar DRM si hay claves
            if (kId && k) {
                log(`Configurando ClearKey.\nKID: ${kId}\nKEY: ${k}`);
                player.configure({
                    drm: {
                        clearKeys: {
                            [kId]: k
                        }
                    }
                });
            } else {
                log("Cargando sin claves DRM explícitas (Video abierto o claves en MPD).");
            }

            try {
                await player.load(manifestUrl);
                log("¡Video cargado correctamente! Debería reproducirse.");
            } catch (e) {
                onError(e);
            }
        }

        function onError(event) {
            // Extraer el error del evento o del objeto error
            let error = event.detail || event;
            log(`ERROR ${error.code}: ${error.message}`);
            if(error.code === 6007 || error.code === 6008) {
                 log("PISTA: Esto suele ser error de licencia/claves.");
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
